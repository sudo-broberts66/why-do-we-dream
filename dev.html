<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene bench</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #cfd; }
  #dream-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 12px; bottom: 12px; right: 12px; display: flex; gap: 12px; align-items: center; opacity: .8; }
  #hud input { flex: 1; }
  #err { position: fixed; top: 0; left: 0; right: 0; max-height: 60%; overflow: auto; white-space: pre-wrap; background: rgba(80,0,0,.85); color: #fff; padding: 8px; display: none; }
  .bare #hud { display: none; }
</style>
</head>
<body>
<canvas id="dream-canvas"></canvas>
<div id="hud"><span id="label"></span><input id="p" type="range" min="0" max="1" step="0.001" value="0"><span id="pv"></span></div>
<pre id="err"></pre>
<script src="js/glsl.js"></script>
<script src="js/core.js"></script>
<script src="js/scenes/threshold.js"></script>
<script src="js/scenes/hypnagogia.js"></script>
<script src="js/scenes/brain.js"></script>
<script src="js/scenes/dreamscape.js"></script>
<script src="js/scenes/octopus.js"></script>
<script src="js/scenes/theories.js"></script>
<script src="js/scenes/dawn.js"></script>
<script>
/* Scene bench.  dev.html?scene=ID&p=0.5&t=12&q=0.5&fade=1&bare=1
   p     0..1 fixed progress, or "auto" to sweep 0→1 over 40 s (default: slider)
   t     freeze time at t seconds (omit to run)
   q     fixed render scale 0.1..1 (omit for adaptive)
   bare  hide the HUD (for screenshots) */
(function () {
  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || '_fallback';
  const auto = q.get('p') === 'auto';
  const p = auto ? 0 : parseFloat(q.get('p') || '0');
  const t = q.has('t') ? parseFloat(q.get('t')) : null;
  if (q.has('bare')) document.body.classList.add('bare');
  const ok = DREAM.boot({ mode: 'dev', scene, p, t, fade: q.has('fade') ? parseFloat(q.get('fade')) : 1 });
  const slider = document.getElementById('p'), pv = document.getElementById('pv');
  document.getElementById('label').textContent = scene;
  slider.value = p; pv.textContent = p.toFixed(3);
  slider.addEventListener('input', () => { DREAM.dev.p = parseFloat(slider.value); pv.textContent = DREAM.dev.p.toFixed(3); });
  if (!ok) { document.getElementById('err').style.display = 'block'; document.getElementById('err').textContent = 'WebGL2 unavailable'; return; }
  const t0 = performance.now();
  DREAM.onFrame(() => {
    if (auto) { DREAM.dev.p = ((performance.now() - t0) / 40000) % 1; slider.value = DREAM.dev.p; pv.textContent = DREAM.dev.p.toFixed(3); }
    if (DREAM.errors.length) { const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = DREAM.errors.join('\n\n'); }
  });
})();
</script>
</body>
</html>
